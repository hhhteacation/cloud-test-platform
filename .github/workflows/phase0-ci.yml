name: Phase 0 CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  web-api:
    name: Web + API tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build web and API
        run: pnpm build

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
