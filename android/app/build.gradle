plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sdktest.platform'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sdktest.platform'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
